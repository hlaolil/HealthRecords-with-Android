[mypy]
# Vercel's Python runtime. Set explicitly so the checker and the
# deployment agree about what the language allows.
python_version = 3.12
python_executable = /usr/bin/python3
files = app.py, cleanup_dormant.py, error_logger.py, audit_logger.py

# The bodies are what matter. Without this, mypy walks past every function
# that has no annotations yet — which was all of them — and finds nothing.
check_untyped_defs = True

# An Optional parameter has to say so. A default of None on a parameter
# declared as a str is how a None reaches a .strip() in production.
no_implicit_optional = True
strict_optional = True

warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True

# Third-party packages without type information. Their absence is not a
# finding about this code.
[mypy-pymongo.*]
ignore_missing_imports = True
[mypy-bson.*]
ignore_missing_imports = True
[mypy-mongomock.*]
ignore_missing_imports = True
[mypy-dotenv.*]
ignore_missing_imports = True
[mypy-requests.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
# No type stubs are published for openpyxl; it is only used to read
# uploaded spreadsheets, and what it returns is checked by hand.
ignore_missing_imports = True

[mypy-qrcode.*]
# Draws the QR code for linking the phone app; no stubs are published.
ignore_missing_imports = True
